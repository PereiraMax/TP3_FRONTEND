<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="matchBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e3f" />
      <stop offset="100%" stop-color="#07152b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="20" y="20" width="360" height="360" rx="44" ry="44" fill="url(#matchBgGrad)" stroke="#1a3668" stroke-width="3" />

  <!-- Football Field Group -->
  <g transform="translate(60, 55)" stroke="#ffcc00" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer boundary of pitch -->
    <rect x="0" y="0" width="280" height="180" rx="14" ry="14" />
    
    <!-- Half-way line -->
    <line x1="140" y1="0" x2="140" y2="180" />
    
    <!-- Center Circle -->
    <circle cx="140" cy="90" r="38" />
    
    <!-- Left Penalty Area -->
    <path d="M 0 45 L 45 45 L 45 135 L 0 135" />
    <!-- Left Goal Area -->
    <path d="M 0 65 L 18 65 L 18 115 L 0 115" />
    
    <!-- Right Penalty Area -->
    <path d="M 280 45 L 235 45 L 235 135 L 280 135" />
    <!-- Right Goal Area -->
    <path d="M 280 65 L 262 65 L 262 115 L 280 115" />
    
    <!-- Left Player spot -->
    <circle cx="95" cy="90" r="8" fill="#0b1e3f" stroke="#ffcc00" stroke-width="4" />
    <!-- Right Player spot -->
    <circle cx="185" cy="90" r="8" fill="#0b1e3f" stroke="#ffcc00" stroke-width="4" />

    <!-- Center Ball with Checkmark -->
    <circle cx="140" cy="90" r="19" fill="#ffcc00" stroke="#ffcc00" stroke-width="2" />
    <!-- Checkmark inside center ball -->
    <path d="M 132 90 L 138 96 L 149 84" fill="none" stroke="#0b1e3f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: Matchdeverdad -->
  <g transform="translate(200, 290)" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text y="0" font-size="34" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#ffcc00">Match</tspan><tspan fill="#ffffff">deverdad</tspan>
    </text>
    <!-- Subtitle: Fútbol 5 · Completá tu partido -->
    <text y="32" font-size="14.5" font-weight="600" fill="#a5c4ec" letter-spacing="0.3">
      Fútbol 5 · Completá tu partido
    </text>
  </g>
</svg>
